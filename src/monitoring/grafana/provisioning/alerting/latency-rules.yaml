apiVersion: 1

groups:
  - orgId: 1
    name: request-latency
    folder: Monitoring
    interval: 1m
    rules:
      - uid: request-p95-latency-high
        title: Request p95 latency is high
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: monitoring-postgres
            model:
              datasource: {type: grafana-postgresql-datasource, uid: monitoring-postgres}
              editorMode: code
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: >-
                SELECT CASE WHEN request_count >= 100 THEN request_latency_p95_ms ELSE NULL END AS value
                FROM monitoring_runs
                WHERE window_end <= date_bin('5 minutes', NOW(), TIMESTAMPTZ '1970-01-01')
                AND window_end = window_start + INTERVAL '5 minutes'
                ORDER BY window_end DESC LIMIT 1
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [600], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: request-latency
        panelId: 1
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: Request p95 latency has exceeded 600 ms for 10 minutes
          description: The latest completed bucket has at least 100 requests and p95 latency above 600 ms.
          __dashboardUid__: request-latency
          __panelId__: "1"
        labels: {service: recommendation-api, severity: warning}
        isPaused: false

      - uid: request-slow-share-high
        title: Slow-request share is high
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: monitoring-postgres
            model:
              datasource: {type: grafana-postgresql-datasource, uid: monitoring-postgres}
              editorMode: code
              format: table
              intervalMs: 1000
              maxDataPoints: 43200
              rawQuery: true
              rawSql: >-
                SELECT CASE WHEN request_count >= 100
                  THEN request_count_over_600ms::double precision / request_count
                  ELSE NULL END AS value
                FROM monitoring_runs
                WHERE window_end <= date_bin('5 minutes', NOW(), TIMESTAMPTZ '1970-01-01')
                AND window_end = window_start + INTERVAL '5 minutes'
                ORDER BY window_end DESC LIMIT 1
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0.05], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: request-traffic
        panelId: 3
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: More than 5% of requests have exceeded 600 ms for 10 minutes
          description: The latest completed bucket has at least 100 requests and an elevated slow-request share.
          __dashboardUid__: request-traffic
          __panelId__: "3"
        labels: {service: recommendation-api, severity: warning}
        isPaused: false
