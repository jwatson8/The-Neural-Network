name: the-neural-network

x-service: &service
  image: the-neural-network:${DEPLOY_TAG:-local}
  build: .
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-database-connection: &database-connection
  DATABASE_HOST: database
  DATABASE_PORT: "5432"
  DATABASE_NAME: ${POSTGRES_DB:-recommender}
  DATABASE_USER: ${POSTGRES_USER:-recommender}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  daily-model-updater:
    <<: *service
    image: ${DAILY_MODEL_IMAGE:-the-neural-network:local}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: [python, -m, src.model_updates.scheduler]
    cpus: 1.0
    mem_limit: 2g
    environment:
      <<: *database-connection
      DAILY_MODEL_UPDATES_ENABLED: ${DAILY_MODEL_UPDATES_ENABLED:-true}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ./artifacts
        target: /artifacts
        bind: {create_host_path: false}
    depends_on:
      database-init: {condition: service_completed_successfully}

  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recommender}
      POSTGRES_USER: ${POSTGRES_USER:-recommender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    expose: ["5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  database-init:
    <<: *service
    restart: "no"
    command: [python, -m, src.database.initialize]
    environment: *database-connection
    depends_on:
      database: {condition: service_healthy}

  database-roll-up:
    <<: *service
    restart: "no"
    command: [python, -m, src.database.roll_up, --data-dir, /app/data]
    environment: *database-connection
    depends_on:
      database-init: {condition: service_completed_successfully}

  train:
    <<: *service
    profiles: [tools]
    restart: "no"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["python", "-m", "src.model.prepare", "--data", "/app/data", "--model", "/artifacts/model.joblib"]
    environment:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ./artifacts
        target: /artifacts
        bind: {create_host_path: false}

  api:
    <<: *service
    ports: ["${BIND_ADDRESS:-0.0.0.0}:${PORT:-8082}:8082"]
    environment:
      <<: *database-connection
      MODEL_PATH: /inputs/model.joblib
      MODEL_VERSION: ${MODEL_VERSION:-m0-svd-v1}
      PROFILE_SEED_PATH: /app/src/model/llm_profiles.json
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ./artifacts
        target: /inputs
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s
    depends_on:
      database-roll-up: {condition: service_completed_successfully}

  cold-start-worker:
    <<: *service
    profiles: [live]
    command: [python, -m, src.service.profile_worker]
    environment:
      <<: *database-connection
      USER_LOOKUP_URL_TEMPLATE: ${USER_LOOKUP_URL_TEMPLATE:-}
      USER_LIKES_FIELD: ${USER_LIKES_FIELD:-self_description_likes}
      USER_DISLIKES_FIELD: ${USER_DISLIKES_FIELD:-self_description_dislikes}
      USER_LOOKUP_TIMEOUT_SECONDS: "3"
      USER_API_BEARER_TOKEN: ${USER_API_BEARER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TIMEOUT_SECONDS: "20"
    depends_on:
      api: {condition: service_healthy}

  course-stream:
    <<: *service
    profiles: [live]
    command: [python, -m, src.service.course_stream]
    environment:
      <<: *database-connection
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      COURSE_LOG_TIMEZONE: ${COURSE_LOG_TIMEZONE:-UTC}
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres-data:
