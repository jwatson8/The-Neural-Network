name: the-neural-network

x-service: &service
  image: the-neural-network:${DEPLOY_TAG:-local}
  build: .
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-database-connection: &database-connection
  DATABASE_HOST: database
  DATABASE_PORT: "5432"
  DATABASE_NAME: ${POSTGRES_DB:-recommender}
  DATABASE_USER: ${POSTGRES_USER:-recommender}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  daily-model-updater:
    <<: *service
    image: ${DAILY_MODEL_IMAGE:-the-neural-network:local}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: [python, -m, src.model_updates.scheduler]
    cpus: 1.0
    mem_limit: 2g
    environment:
      <<: *database-connection
      DAILY_MODEL_UPDATES_ENABLED: ${DAILY_MODEL_UPDATES_ENABLED:-true}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ./artifacts
        target: /artifacts
        bind: {create_host_path: false}
    depends_on:
      database-init: {condition: service_completed_successfully}

  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recommender}
      POSTGRES_USER: ${POSTGRES_USER:-recommender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    expose: ["5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  database-init:
    <<: *service
    restart: "no"
    command: [python, -m, src.database.initialize]
    environment: *database-connection
    depends_on:
      database: {condition: service_healthy}

  database-roll-up:
    <<: *service
    restart: "no"
    command: [python, -m, src.database.roll_up, --data-dir, /app/data]
    environment: *database-connection
    depends_on:
      database-init: {condition: service_completed_successfully}

  monitoring-worker:
    <<: *service
    profiles: [monitoring]
    command: [python, -m, src.monitoring.monitoring_worker]
    environment: *database-connection
    depends_on:
      database-init: {condition: service_completed_successfully}

  grafana-database-init:
    <<: *service
    profiles: [monitoring]
    restart: "no"
    command: [python, -m, src.monitoring.grafana.provision_reader]
    environment:
      <<: *database-connection
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    depends_on:
      database-init: {condition: service_completed_successfully}

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [monitoring]
    restart: unless-stopped
    init: true
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource 3.8.0
      GRAFANA_DB_NAME: ${POSTGRES_DB:-recommender}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./src/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./src/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      grafana-database-init: {condition: service_completed_successfully}
      api: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  train:
    <<: *service
    profiles: [tools]
    restart: "no"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["python", "-m", "src.model.prepare", "--data", "/app/data", "--model", "/artifacts/model.joblib"]
    environment:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ./artifacts
        target: /artifacts
        bind: {create_host_path: false}

  api:
    <<: *service
    ports: ["${BIND_ADDRESS:-0.0.0.0}:${PORT:-8082}:8082"]
    environment:
      <<: *database-connection
      MODEL_PATH: /inputs/model.joblib
      MODEL_VERSION: ${MODEL_VERSION:-m0-svd-v1}
      PROFILE_SEED_PATH: /app/src/model/llm_profiles.json
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ./artifacts
        target: /inputs
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s
    depends_on:
      database-roll-up: {condition: service_completed_successfully}

  cold-start-worker:
    <<: *service
    profiles: [live]
    command: [python, -m, src.service.profile_worker]
    environment:
      <<: *database-connection
      USER_LOOKUP_URL_TEMPLATE: ${USER_LOOKUP_URL_TEMPLATE:-}
      USER_LIKES_FIELD: ${USER_LIKES_FIELD:-self_description_likes}
      USER_DISLIKES_FIELD: ${USER_DISLIKES_FIELD:-self_description_dislikes}
      USER_LOOKUP_TIMEOUT_SECONDS: "3"
      USER_API_BEARER_TOKEN: ${USER_API_BEARER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TIMEOUT_SECONDS: "20"
    depends_on:
      api: {condition: service_healthy}

  kafka-tunnel:
    <<: *service
    profiles: [live]
    command: [bash, /app/deployment/kafka_tunnel.sh]
    environment:
      SSHPASS: ${KAFKA_SSH_PASSWORD:-}
      KAFKA_SSH_KNOWN_HOSTS: ${KAFKA_SSH_KNOWN_HOSTS:-}
      KAFKA_SSH_HOST: ${KAFKA_SSH_HOST:-128.2.24.239}
      KAFKA_SSH_USER: ${KAFKA_SSH_USER:-kafkatunnel}
      KAFKA_SSH_PORT: ${KAFKA_SSH_PORT:-22}
      KAFKA_REMOTE_HOST: ${KAFKA_REMOTE_HOST:-localhost}
      KAFKA_REMOTE_PORT: ${KAFKA_REMOTE_PORT:-9092}
      KAFKA_TUNNEL_LOCAL_PORT: ${KAFKA_TUNNEL_LOCAL_PORT:-9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-movielog1-recommender}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 $${KAFKA_TUNNEL_LOCAL_PORT}"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  course-stream:
    <<: *service
    profiles: [live]
    command: [python, -m, src.service.course_stream]
    network_mode: service:kafka-tunnel
    environment:
      <<: *database-connection
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:${KAFKA_TUNNEL_LOCAL_PORT:-9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-movielog1-recommender}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      COURSE_LOG_TIMEZONE: ${COURSE_LOG_TIMEZONE:-UTC}
    depends_on:
      api: {condition: service_healthy}
      kafka-tunnel:
        condition: service_healthy
        restart: true

volumes:
  postgres-data:
  grafana-data:
  profiles:
    # Reuse the original VM smoke deployment's persistent profiles by default.
    name: ${PROFILE_VOLUME_NAME:-neural-network-smoke_smoke-profiles}
