name: Model and Docker integration
on:
  pull_request:
  push:
    branches: [main, integration/m0-flask-deployment]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PROFILE_VOLUME_NAME: ci-profiles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements*.txt
      - run: pip install -r src/requirements-service.txt
      - run: python -m unittest discover -s src/tests -v
      - run: docker compose --profile live config --quiet
      - run: docker compose build api
      - run: mkdir -p artifacts
      - run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose --profile tools run --rm train
      - run: docker compose up -d --wait --wait-timeout 120
      - run: docker compose exec -T api python deployment/smoke_test.py
      - run: curl --fail --max-time 0.6 http://127.0.0.1:8082/recommend/1
      - if: always()
        run: docker compose logs --tail=60
      - if: always()
        run: docker compose down
