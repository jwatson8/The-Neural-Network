name: CI and deployment
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this tested main commit to the VM
        type: boolean
        default: false
      live:
        description: Enable configured Kafka and cold-start services
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements*.txt
      - run: pip install -r src/requirements-test.txt
      - run: python -m pytest
      - name: Publish test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
      - name: Coverage summary
        if: always()
        run: |
          if [ -f reports/coverage.md ]; then
            printf '### Coverage\n' >> "$GITHUB_STEP_SUMMARY"
            cat reports/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
  docker:
    name: Docker verification
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-not-a-production-secret
      BIND_ADDRESS: 127.0.0.1
      DAILY_MODEL_UPDATES_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile live config --quiet
      - run: docker compose build api
      - run: mkdir -p artifacts
      - name: Train checked-in fixture without production access
        run: LOCAL_UID=$(id -u) LOCAL_GID=$(id -g) docker compose --profile tools run --rm train
      - run: docker compose up -d --wait --wait-timeout 120
      - run: docker compose exec -T api python -m deployment.smoke_test
      - run: curl --fail --max-time 0.6 http://127.0.0.1:8082/recommend/1
      - name: Daily job uses isolated PostgreSQL and retains model without fresh data
        run: |
          before=$(sha256sum artifacts/model.joblib)
          docker compose run --rm --no-deps --user "$(id -u):$(id -g)" daily-model-updater python -m src.model_updates.daily
          test "$before" = "$(sha256sum artifacts/model.joblib)"
          python -c 'import glob,json; r=json.load(open(glob.glob("artifacts/daily/*/report.json")[0])); assert r["status"] == "insufficient_data"; assert not r["eligible_for_manual_promotion"]'
          mkdir -p reports
          cp artifacts/daily/*/report.json reports/daily-report.json
      - name: Verify actual model swap and rollback in isolated containers
        run: |
          before=$(sha256sum artifacts/model.joblib)
          docker compose run --rm --no-deps --user "$(id -u):$(id -g)" -e CI_DAILY_SMOKE=1 daily-model-updater python -m src.tests.ci_model_swap
          bash deployment/daily_model.sh promote 2000-01-01
          bash deployment/daily_model.sh rollback 2000-01-01
          test "$before" = "$(sha256sum artifacts/model.joblib)"
          cp artifacts/daily/2000-01-01/promotion.json reports/ci-promotion.json
      - name: Collect container evidence
        if: always()
        run: |
          mkdir -p reports
          docker compose ps --all > reports/containers.txt
          docker compose logs --no-color --tail=100 > reports/containers.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-reports
          path: reports/
      - if: always()
        run: docker compose down --volumes
  deploy:
    name: Deploy to CMU VM (manual)
    needs: [tests, docker]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, cmu-deploy]
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy exact tested commit over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET_SHA: ${{ github.sha }}
          ENABLE_LIVE: ${{ inputs.live }}
        run: bash deployment/ssh_deploy.sh
